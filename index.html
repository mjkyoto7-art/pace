<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PACE｜進行タイマー</title><meta name="description" content="各項目の持ち時間を番号順に測るプレゼン進行タイマー。全体と項目の残り時間を表示し、切り替わりを点滅で知らせます。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232d50ec'/%3E%3Ccircle cx='16' cy='17' r='10' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M16 10v7l4 2M12 3h8' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--blue:#2d50ec;--ink:#18223a;--muted:#68728a;--line:#e4e8f0;--paper:#f3f5fa;--accent:#d9f779}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #6e8bff;outline-offset:3px}button:disabled{cursor:default;opacity:.5}header{max-width:1400px;margin:auto;padding:26px 36px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:12px;align-items:center}.brand-mark{color:var(--blue);width:34px;height:34px}.brand b{font-size:24px;letter-spacing:.06em}.brand span{border-left:1px solid #cbd1df;padding-left:14px;font-size:14px;color:var(--muted)}.tools{display:flex;gap:8px}.icon-button{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 14px;border-radius:10px;display:flex;gap:8px;align-items:center;font-size:14px;white-space:nowrap}.icon-button svg{width:18px;height:18px}main{max-width:1400px;padding:0 36px 32px;margin:auto;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(370px,1fr);gap:24px}.monitor{background:#152039;color:white;border-radius:22px;padding:32px;display:flex;flex-direction:column;min-height:690px;position:sticky;top:24px;align-self:start;overflow:hidden;box-shadow:0 14px 34px #1727430b}.monitor-top{display:flex;align-items:center;justify-content:space-between;gap:16px;color:#acb7ce;font-size:14px}.status{display:inline-flex;align-items:center;gap:8px;border:1px solid #4b5670;border-radius:99px;padding:6px 13px;color:#dbe4f6}.status i{width:7px;height:7px;border-radius:50%;background:#91a0bc}.status.running i{background:var(--accent)}.clock-space{padding:56px 0 48px;text-align:center}.eyebrow{color:#b6c2d9;font-size:15px;letter-spacing:.1em}.elapsed{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:clamp(65px,8.6vw,124px);line-height:1.25;letter-spacing:-.06em;white-space:nowrap;margin:8px 0 12px}.time-note{color:#9eabc3;font-size:14px}.next{border-top:1px solid #344159;border-bottom:1px solid #344159;padding:22px 0;display:flex;justify-content:space-between;align-items:center;gap:14px}.next small{color:#adbad1;font-size:14px}.next-label{font-size:20px;font-weight:600;margin-top:4px;overflow-wrap:anywhere}.remaining{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:38px;line-height:1.25;color:var(--accent);white-space:nowrap}.remaining-label{color:#adbad1;font-size:14px;text-align:right}.progress-area{padding:26px 0 32px}.progress-caption{display:flex;justify-content:space-between;gap:12px;color:#b4c0d7;font-size:14px;margin-bottom:12px}.track{height:8px;border-radius:10px;background:#344159;overflow:hidden}.fill{height:100%;background:var(--accent);width:0;transition:width .2s linear}.controls{margin-top:auto;display:flex;gap:12px}.primary{flex:1;border:0;background:var(--blue);color:white;font-weight:600;font-size:18px;padding:17px 24px;border-radius:12px}.primary:hover{background:#4263f1}.reset{border:1px solid #56617a;color:#e5ebf6;background:transparent;padding:17px 22px;border-radius:12px}.monitor-foot{font-size:14px;color:#93a3c0;text-align:center;margin:17px 0 0}.settings{background:white;border:1px solid var(--line);border-radius:22px;padding:26px 24px 16px}.settings-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0;font-weight:700}.count{color:var(--blue);background:#eef1ff;font-size:14px;border-radius:6px;padding:3px 8px}.intro{color:var(--muted);font-size:14px;margin:8px 0 22px}.column-head{display:grid;grid-template-columns:28px 28px minmax(50px,1fr) 128px;gap:8px;font-size:13px;color:var(--muted);padding:0 0 8px}.column-head span:last-child{text-align:right}.row{display:grid;grid-template-columns:28px 28px minmax(50px,1fr) 128px;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0;min-height:54px}.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue);cursor:pointer;margin:0}.row-number{font-size:13px;color:#8a94a9;font-variant-numeric:tabular-nums}.label-input{min-width:0;width:100%;border:1px solid transparent;color:var(--ink);padding:5px 3px;font-size:14px;background:transparent;border-radius:6px}.label-input:hover,.label-input:focus{border-color:#dce2ee;background:#fafbfe}.label-input::placeholder{color:#a0a8ba}.time-inputs{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:13px;color:var(--muted)}.time-inputs input{width:45px;height:34px;border:1px solid #dce1ec;background:#f8f9fc;border-radius:7px;text-align:center;font-size:16px;color:var(--ink);appearance:textfield}.time-inputs input::-webkit-inner-spin-button{appearance:none}.row.off{opacity:.48}.row.done .row-number{color:var(--blue);font-weight:700}.row.done .label-input{color:var(--muted)}.row.next-row{background:#f1f4ff;margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:8px;border-top-color:transparent}.legend{font-size:13px;color:var(--muted);margin:15px 0 0;display:flex;justify-content:space-between;gap:10px}.alert-box{background:var(--accent);color:#172338;border-radius:12px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin:22px 0 0}.alert-box[hidden]{display:none}.alert-title{font-weight:700;font-size:20px}.alert-detail{font-size:14px;margin-top:4px}.ack{border:1px solid #749338;background:transparent;color:#172338;border-radius:8px;padding:8px 12px;white-space:nowrap;font-size:14px}.monitor.alerting{animation:beacon 1.5s ease-in-out 4}.monitor.alerting .elapsed{color:var(--accent)}@keyframes beacon{0%,100%{box-shadow:inset 0 0 0 0 #d9f779}50%{box-shadow:inset 0 0 0 8px #d9f779}}.error{font-size:14px;color:#b92e46;margin-top:14px}.error:empty{display:none}.keyboard{font-size:13px;color:var(--muted);margin:12px 0 0;text-align:center}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#172338;color:white;border-radius:10px;padding:12px 20px;z-index:5;max-width:90vw;font-size:14px}.notice:empty{display:none}@media(min-width:1550px){.elapsed{font-size:124px}}@media(max-width:1050px){main{grid-template-columns:minmax(0,1.2fr) minmax(355px,1fr);gap:18px;padding:0 24px 24px}header{padding:22px 24px}.monitor{padding:26px 24px}.settings{padding:24px 18px 16px}.elapsed{font-size:clamp(60px,8vw,92px)}.remaining{font-size:30px}.clock-space{padding:62px 0}.brand span{display:none}}@media(max-width:790px){main{grid-template-columns:1fr;padding:0 16px 24px}header{padding:18px 16px}.brand b{font-size:22px}.brand-mark{width:28px}.icon-button{padding:9px 10px}.monitor{position:relative;top:0;min-height:0;padding:24px}.clock-space{padding:30px 0}.elapsed{font-size:clamp(58px,14vw,112px)}.progress-area{padding:22px 0}.settings{padding:24px}.monitor-foot{margin-top:13px}.keyboard{display:none}}@media(max-width:390px){header{gap:8px}.tools{gap:5px}.icon-button{font-size:13px;padding:8px}.icon-button svg{display:none}.monitor{padding:20px}.settings{padding:22px 16px}.row,.column-head{grid-template-columns:22px 24px minmax(40px,1fr) 128px;gap:4px}.next-label{font-size:18px}.remaining{font-size:28px}.reset{padding:15px}.primary{padding:15px}.alert-box{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){.monitor.alerting{animation:none;box-shadow:inset 0 0 0 6px var(--accent)}.fill{transition:none}}body:fullscreen{overflow:auto;background:var(--paper)}
.budget{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:14px 0 20px;color:var(--muted);font-size:14px}.budget strong{font:600 28px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);font-variant-numeric:tabular-nums}@media(max-width:790px){.time-inputs input{height:44px}.row{min-height:64px}.row input[type=checkbox]{width:24px;height:24px}.icon-button{min-height:44px}.settings h1{font-size:18px}.settings .count{white-space:nowrap}}body.display-mode main{display:block}body.display-mode main>section:last-child{display:none}body.display-mode .monitor{min-height:calc(100dvh - 100px);position:relative;top:0}body.display-mode .clock-space{padding:clamp(30px,10vh,100px) 0}body.display-mode .elapsed{font-size:clamp(70px,18vw,160px)}</style>
</head>
<body>
<header><div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="18" r="11" stroke="currentColor" stroke-width="2.5"/><path d="M16 11v7l5 3M12 2h8M16 2v5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg><b>PACE</b><span>進行タイマー</span></div><div class="tools"><button id="sound" class="icon-button" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5zM16 9l6 6m0-6l-6 6"/></svg><span>ミュート中</span></button><button id="fullscreen" class="icon-button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>全画面</span></button></div></header>
<main>
<section id="monitor" class="monitor" aria-label="タイマー表示"><div class="monitor-top"><span>プレゼン・授業の進行確認</span><span id="status" class="status"><i></i><span>待機中</span></span></div><div class="clock-space"><div class="eyebrow">全体の残り時間</div><div id="elapsed" class="elapsed" role="timer" aria-label="全体の残り時間">20:00</div><div id="total-note" class="time-note">経過 00:00 / 合計 20:00</div></div><div class="next"><div><small id="next-caption">最初の項目 · 01</small><div id="next-label" class="next-label">挨拶</div></div><div><div id="remaining" class="remaining">02:00</div><div id="remaining-label" class="remaining-label">この項目の残り</div></div></div><div class="progress-area"><div class="progress-caption"><span id="progress-caption">全体の進行</span><span id="progress-value">0 / 5 項目</span></div><div class="track" role="progressbar" aria-label="設定時間の進行" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill" class="fill"></div></div></div><div id="alert" class="alert-box" role="status" aria-live="polite" hidden><div><div id="alert-title" class="alert-title"></div><div id="alert-detail" class="alert-detail"></div></div><button id="ack" class="ack">確認</button></div><div class="controls"><button id="start" class="primary">開始する</button><button id="reset" class="reset" disabled>リセット</button></div><p class="monitor-foot">項目の切り替わりと全体の終了を、点滅でお知らせします。</p></section>
<section><div class="settings"><div class="settings-heading"><h1>項目ごとの持ち時間</h1><span id="count" class="count">5項目</span></div><p class="intro">01から順に、それぞれの持ち時間を測ります。<br>使わない行はチェックを外してください。</p><p id="settings-save-status" class="intro" role="status">変更すると、このブラウザに自動保存します。</p><div class="budget"><span>合計の持ち時間</span><strong id="total-budget">20:00</strong></div><div class="column-head" aria-hidden="true"><span></span><span>No.</span><span>名前（任意）</span><span>持ち時間</span></div><div id="rows"></div><div class="legend"><span>✓ 終了した項目</span><button id="test" class="icon-button" style="border:0;padding:0;background:transparent;color:var(--blue)">お知らせを試す</button></div><p id="error" class="error" role="alert"></p></div><p class="keyboard">スペースキーで開始 / 一時停止</p></section>
</main><div id="notice" class="notice" role="status"></div>
<script src="app.js?v=settings-v1"></script>
</body></html>
